<dialog id="comic-reader" aria-labelledby="reader-title">
<button type="button" id="reader-close" aria-label="Close comic" autofocus><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
<div class="reader-content"><div class="reader-art"><div class="reader-picture"><img id="reader-image" alt="" width="2000" height="1500"></div><div class="reader-navigation"><button type="button" id="reader-prev" aria-label="Previous comic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button><span id="reader-position" aria-live="polite"></span><button type="button" id="reader-next" aria-label="Next comic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button></div></div>
<article class="reader-note"><h2 id="reader-title" tabindex="-1"></h2><p id="reader-context"></p><div class="reader-actions"><a id="reader-download" class="download-link" download>Download</a><button type="button" id="reader-copy">Copy link</button></div><p id="reader-message" role="status" aria-live="polite"></p><label id="copy-fallback" hidden>Copy this link<input id="copy-url" readonly></label></article></div>
</dialog>
